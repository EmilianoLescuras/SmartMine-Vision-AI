name: smartmine
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.12
  - pytorch>=2.3.0
  - torchvision>=0.18.0
  - cudatoolkit=11.8          # Remove if CPU-only
  - numpy>=1.26.0
  - pandas>=2.2.0
  - scipy>=1.13.0
  - jupyterlab>=4.2.0
  - matplotlib>=3.9.0
  - seaborn>=0.13.0
  - ipywidgets>=8.1.0
  - pyyaml>=6.0.1
  - tqdm>=4.66.0
  - pip
  - pip:
    - ultralytics>=8.2.0
    - opencv-python>=4.9.0
    - Pillow>=10.3.0
    - python-dotenv>=1.0.1
    - loguru>=0.7.2
